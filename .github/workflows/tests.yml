name: tests

on:
  push:
  pull_request:

env:
  GODOT_VERSION: 4.7.2

jobs:
  tests:
    name: Headless-тесты
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Кэш Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Скачать Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot

      - name: Импорт проекта
        run: |
          chmod +x ~/godot/godot
          ~/godot/godot --headless --path . --import || true
          ~/godot/godot --headless --path . --import || true

      - name: Тесты
        run: |
          mkdir -p reports
          status=0
          for t in tests/*_test.gd; do
            name=$(basename "$t" .gd)
            echo "::group::$name"
            if timeout 1500 ~/godot/godot --headless --path . -s "res://$t" > "reports/$name.log" 2>&1 \
                && ! grep -q "SCRIPT ERROR\|Parse Error" "reports/$name.log"; then
              echo "$name: OK" | tee -a reports/summary.txt
            else
              echo "$name: FAILED" | tee -a reports/summary.txt
              status=1
            fi
            tail -n 30 "reports/$name.log"
            echo "::endgroup::"
          done
          exit $status

      - name: Дым-прогон всех систем (300 лет, 3 мира)
        run: |
          timeout 2400 ~/godot/godot --headless --path . -s res://tests/all_systems_smoke.gd -- 300 \
            > reports/all_systems_smoke.log 2>&1
          cat reports/all_systems_smoke.log | grep -v "^Godot"
          ! grep -q "SCRIPT ERROR\|FAIL" reports/all_systems_smoke.log

      - name: Отчёт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/

  profile:
    name: Бюджет производительности
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Кэш Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux
      - name: Скачать Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
      - name: Профиль (огромная карта, 40 государств, 150 лет)
        run: |
          chmod +x ~/godot/godot
          ~/godot/godot --headless --path . --import || true
          ~/godot/godot --headless --path . --import || true
          # Бюджет — мс симуляции на игровой месяц в среднем (с запасом на медленные раннеры CI).
          # 12.C: освоение (+~2 мс) и больше войн между цельными державами — около 13 мс.
          ~/godot/godot --headless --path . -s res://tests/profile_systems.gd -- 150 3 40 5 15.0
